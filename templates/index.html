<!DOCTYPE html>
<html>
<head>
    <title>Startup Success Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold">🚀 Startup Success Estimator</h1>
            <p class="lead">Predict the chances of your startup's success</p>
        </div>
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <form action="/predict" method="POST">
                <div class="mb-3">
                    <label for="experience" class="form-label">Founder's Experience (years)</label>
                    <input type="number" name="experience" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="funding" class="form-label">Funding Received ($1000s)</label>
                    <input type="number" name="funding" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="team_size" class="form-label">Team Size</label>
                    <input type="number" name="team_size" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Estimate Success</button>
            </form>
        </div>
    </div>
</body>
</html>
