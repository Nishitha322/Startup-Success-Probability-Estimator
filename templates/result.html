<!DOCTYPE html>
<html>
<head>
    <title>Result - Success Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="display-4 text-success">📈 Result</h1>
        <p class="lead mt-3">Your estimated startup success probability is:</p>
        <h2 class="fw-bold display-3 text-primary">{{ probability }}%</h2>
        <a href="/" class="btn btn-outline-primary mt-4">🔁 Try Again</a>
    </div>
</body>
</html>
